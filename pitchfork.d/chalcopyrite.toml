# ranch/mesh/proxy/chalcopyrite — project-owned daemon manifest. Source of truth for 'chalcopyrite'.
# The canonical estate router. Binds :25200 via CHALCOPYRITE_PORT.
# NOTE: the baked-in config default 25194 is held by the Ralph dashboard
# (uvicorn); 25195 is held by codebase-memory. Do not move this daemon
# onto either without re-homing the holder first.

[daemons.chalcopyrite]
run = "exec bun run src/server.ts"
dir = "/home/toxic/estate/ranch/mesh/proxy/chalcopyrite"
retry = true
ready_http = "http://127.0.0.1:25200/health"
health_http = { url = "http://127.0.0.1:25200/health", interval = "30s", timeout = "5s", retries = 3 }
env = { CHALCOPYRITE_PORT = "25200", CHALCOPYRITE_LOG_LEVEL = "info" }
auto = ["start"]
